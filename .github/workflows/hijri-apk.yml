name: Build Hijri Converter APK

on:
  push:
    paths: ["hijri_converter/**", ".github/workflows/hijri-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hijri_converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hijri-converter-apk
          path: hijri_converter/build/app/outputs/flutter-apk/app-release.apk
