name: Build Hijri Converter APK

on:
  push:
    paths: ["hijri_converter/**", ".github/workflows/hijri-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hijri_converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hijri-converter-apk
          path: hijri_converter/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk hijri-converter.apk
          gh release delete hijri-latest --yes --cleanup-tag || true
          gh release create hijri-latest hijri-converter.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "محوّل التاريخ الهجري (أندرويد)" \
            --notes "ملف APK للتثبيت المباشر على أندرويد. بُني من الإصدار $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}
